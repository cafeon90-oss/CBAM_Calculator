name: Fetch CBAM News (Monthly)

# 매월 1일 09:00 KST (= 매월 1일 00:00 UTC)에 실행.
# 수동 큐레이션 항목은 보존하고 새 공지만 자동 수집해 추가한다 — 로직은 scripts/fetch_cbam_news.py
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:    # 수동 트리거 가능

jobs:
  fetch-cbam-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # repo에 commit 권한 필요

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch CBAM news
        id: fetch
        # 수집이 전부 실패해도 fetch_log·last_fetched는 커밋하고, 마지막 단계에서 실패로 표시
        continue-on-error: true
        run: python scripts/fetch_cbam_news.py

      - name: Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cbam_news.json
          if git diff --staged --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "chore(news): monthly CBAM news auto-update [skip ci]"
            git push
          fi

      - name: Report fetch failure
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::모든 뉴스 소스 수집 실패 — data/cbam_news.json의 fetch_log 확인"
          exit 1
